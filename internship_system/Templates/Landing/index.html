<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternTrack - Manage Internships Smarter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary:      #0dcaf0;
            --primary-dark: #0aa2c0;
            --bg:           #ffffff;
            --text:         #000000;
            --text-muted:   #6c757d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        nav {
            background-color: var(--bg);
            border-bottom: 2px solid var(--primary);
            padding: 16px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand { font-size: 1.6rem; font-weight: 800; color: var(--primary-dark); text-decoration: none; }

        .nav-links { display: flex; align-items: center; gap: 8px; }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            padding: 6px 14px;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--primary-dark); }

        .btn-login {
            background-color: var(--primary);
            color: #000 !important;
            padding: 8px 20px;
            border-radius: 7px;
            font-weight: 700;
            transition: background 0.2s;
        }

        .btn-login:hover { background-color: var(--primary-dark); color: #fff !important; }

        .btn-register {
            border: 1.5px solid var(--primary);
            color: var(--primary-dark) !important;
            padding: 8px 20px;
            border-radius: 7px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-register:hover { background-color: var(--primary); color: #000 !important; }

        html, body { overflow-x: hidden; }

        .hero {
            position: relative;
            height: calc(100vh - 66px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            object-fit: cover;
            z-index: 0;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.52);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: #fff;
            padding: 20px;
        }

        .hero-content h1 { font-size: 3.2rem; font-weight: 800; margin-bottom: 18px; }
        .hero-content h1 span { color: var(--primary); }
        .hero-content p { font-size: 1.15rem; max-width: 580px; margin: 0 auto 40px; line-height: 1.8; color: rgba(255,255,255,0.85); }

        .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .hero-btns a {
            padding: 14px 36px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }
        .hero-btn-login { background-color: var(--primary); color: #000; }
        .hero-btn-login:hover { background-color: var(--primary-dark); color: #fff; }
        .hero-btn-register { border: 2px solid #fff; color: #fff; }
        .hero-btn-register:hover { background-color: #fff; color: #000; }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2rem; }
            nav { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a class="brand" href="/"><i class="bi bi-briefcase-fill me-2"></i>InternTrack</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
            <a href="/login/" class="btn-login">Login</a>
            <a href="/register/" class="btn-register">Register</a>
        </div>
    </nav>

    <section class="hero">
        <video class="hero-video" autoplay muted loop playsinline>
            <source src="https://videos.pexels.com/video-files/3195394/3195394-uhd_2560_1440_25fps.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Manage Internships <span>Smarter</span></h1>
            <p>InternTrack connects students, organizations, supervisors, and universities on one platform to streamline the entire internship process.</p>
            <div class="hero-btns">
                <a href="/login/" class="hero-btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a>
                <a href="/register/" class="hero-btn-register"><i class="bi bi-person-plus me-2"></i>Register</a>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
