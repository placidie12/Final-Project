<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - InternTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary:      #0dcaf0;
            --primary-dark: #0aa2c0;
            --bg:           #ffffff;
            --text:         #000000;
            --text-muted:   #6c757d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); }

        nav {
            background-color: var(--bg);
            border-bottom: 2px solid var(--primary);
            padding: 16px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand { font-size: 1.6rem; font-weight: 800; color: var(--primary-dark); text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a { color: var(--text); text-decoration: none; padding: 6px 14px; font-size: 1rem; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: var(--primary-dark); }
        .btn-login { background-color: var(--primary); color: #000 !important; padding: 8px 20px; border-radius: 7px; font-weight: 700; }
        .btn-login:hover { background-color: var(--primary-dark); color: #fff !important; }
        .btn-register { border: 1.5px solid var(--primary); color: var(--primary-dark) !important; padding: 8px 20px; border-radius: 7px; font-weight: 700; }
        .btn-register:hover { background-color: var(--primary); color: #000 !important; }

        .page-hero {
            background: linear-gradient(135deg, #f0fbff 0%, #e0f7fc 100%);
            padding: 80px 20px;
            text-align: center;
        }
        .page-hero h1 { font-size: 2.8rem; font-weight: 800; }
        .page-hero h1 span { color: var(--primary-dark); }
        .page-hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 500px; margin: 16px auto 0; line-height: 1.8; }

        .contact-section { padding: 70px 20px; }

        .contact-card {
            border: 1.5px solid #e0f7fc;
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
        }
        .contact-card i { font-size: 2rem; color: var(--primary-dark); margin-bottom: 12px; }
        .contact-card h6 { font-weight: 700; margin-bottom: 6px; }
        .contact-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .form-card {
            border: 1.5px solid #e0f7fc;
            border-radius: 12px;
            padding: 40px;
        }
        .form-label { font-weight: 600; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(13,202,240,0.2); }
        .btn-send {
            background-color: var(--primary);
            color: #000;
            font-weight: 700;
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-send:hover { background-color: var(--primary-dark); color: #fff; }

        footer { background-color: #f0fbff; border-top: 2px solid var(--primary); padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <a class="brand" href="/"><i class="bi bi-briefcase-fill me-2"></i>InternTrack</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/contact/" style="color: var(--primary-dark);">Contact</a>
            <a href="/login/" class="btn-login">Login</a>
            <a href="/register/" class="btn-register">Register</a>
        </div>
    </nav>

    <div class="page-hero">
        <h1>Contact <span>Us</span></h1>
        <p>Have a question or need help? We'd love to hear from you.</p>
    </div>

    <div class="contact-section">
        <div class="container">
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="contact-card">
                        <i class="bi bi-envelope-fill"></i>
                        <h6>Email</h6>
                        <p>support@interntrack.com</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="contact-card">
                        <i class="bi bi-telephone-fill"></i>
                        <h6>Phone</h6>
                        <p>+250 789425456</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="contact-card">
                        <i class="bi bi-geo-alt-fill"></i>
                        <h6>Location</h6>
                        <p>Kigali, Rwanda</p>
                    </div>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="form-card">
                        <h5 class="fw-bold mb-4">Send us a message</h5>
                        <form id="contact-form">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Your name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn-send">
                                <i class="bi bi-send me-2"></i>Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 InternTrack. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Message sent! We will get back to you soon.');
            this.reset();
        });
    </script>
</body>
</html>
